background {
  color = rgba(0, 0, 0, 0.8)
}

shape {
  size = 660, 80
  color = rgba(0, 0, 0, 0.0)
  border_size = 0
  position = 0, 80
  halign = center
  valign = center
}

input-field {
  size = 20%, 5%
  outline_thickness = 3
  inner_color = rgba(0, 0, 0, 0.0)
  outer_color = rgba(122, 162, 247, 1)
  check_color = rgba(125, 207, 255, 1)
  fail_color = rgba(247, 118, 142, 1)
  capslock_color = rgba(224, 175, 104, 1)
  font_color = rgba(255, 255, 255, 1)
  fade_on_empty = false
  rounding = 15
  position = 0, -20
  halign = center
  valign = center
}

label {
  text = I'm locked... say the magic password!
  color = rgba(255, 255, 255, 1)
  font_family = Noto Sams
  font_size = 25
  position = 0, 80
  halign = center
  valign = center
}
